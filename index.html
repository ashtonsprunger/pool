<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F1419" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>8-Ball Pool</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top Material 3 HUD Bar -->
      <header class="hud-bar">
        <div class="player-pill" id="p1-pill">
          <div class="player-header">
            <span class="player-name" id="p1-name">P1</span>
            <span class="player-group-tag" id="p1-group">Open</span>
          </div>
          <div class="ball-rack-dots" id="p1-balls"></div>
        </div>

        <div class="status-chip" id="status-chip" aria-live="polite">
          Break Shot
        </div>

        <div class="player-pill" id="p2-pill">
          <div class="player-header">
            <span class="player-name" id="p2-name">P2</span>
            <span class="player-group-tag" id="p2-group">Open</span>
          </div>
          <div class="ball-rack-dots" id="p2-balls"></div>
        </div>

        <button class="room-btn" id="room-btn" type="button" aria-label="Multiplayer & Room">
          <span class="conn-dot" id="conn-dot"></span>
          <span id="room-btn-label">Multiplayer</span>
        </button>

        <button class="install-btn hidden" id="install-app-btn" type="button" aria-label="Install App">
          Install App
        </button>
      </header>

      <!-- Main Table Stage -->
      <main class="table-stage" id="table-stage">
        <canvas id="pool-canvas"></canvas>

        <!-- Winner Overlay Action -->
        <div class="winner-banner hidden" id="winner-banner">
          <div class="winner-title" id="winner-title">Player 1 Wins</div>
          <button class="m3-btn m3-btn-primary" id="rematch-btn" type="button">
            New Rack
          </button>
        </div>
      </main>

      <!-- Bottom Tactile Control Dock -->
      <footer class="control-dock" id="control-dock">
        <!-- Cue Ball Spin / English Button -->
        <button class="spin-trigger" id="spin-trigger" type="button" aria-label="Cue Ball Spin">
          <span class="spin-ball-mini">
            <span class="spin-dot-mini" id="spin-dot-mini"></span>
          </span>
        </button>

        <!-- Fine Angle Adjustment (Visible in Cheat Mode) -->
        <div class="fine-aim-wrap hidden" id="fine-aim-wrap">
          <button class="fine-step-btn" id="fine-aim-left" type="button" aria-label="Rotate aim counter-clockwise">‹</button>
          <div class="fine-aim-wheel" id="fine-aim-wheel" role="slider" aria-label="Fine angle adjustment">
            <div class="fine-aim-ticks" id="fine-aim-ticks"></div>
            <span class="fine-aim-label">Fine Angle</span>
          </div>
          <button class="fine-step-btn" id="fine-aim-right" type="button" aria-label="Rotate aim clockwise">›</button>
        </div>

        <!-- Pull-back / Set Cue Power Slider -->
        <div class="power-track-wrap" id="power-track-wrap">
          <div class="power-track" id="power-track">
            <div class="power-fill" id="power-fill"></div>
            <div class="power-cue-thumb" id="power-thumb"></div>
            <span class="power-hint" id="power-hint">Pull to shoot</span>
          </div>
        </div>

        <!-- Fire Shot Button (Visible in Cheat Mode) -->
        <button class="m3-btn m3-btn-primary shoot-btn hidden" id="shoot-btn" type="button">
          Shoot
        </button>
      </footer>

      <!-- Cue Ball Spin Popover -->
      <div class="modal-backdrop hidden" id="spin-modal">
        <div class="m3-sheet spin-sheet" role="dialog" aria-label="Cue Ball Spin">
          <div class="spin-pad" id="spin-pad">
            <div class="spin-crosshair-h"></div>
            <div class="spin-crosshair-v"></div>
            <div class="spin-contact-dot" id="spin-contact-dot"></div>
          </div>
          <div class="sheet-actions">
            <button class="m3-btn m3-btn-tonal" id="spin-reset-btn" type="button">Center</button>
            <button class="m3-btn m3-btn-primary" id="spin-done-btn" type="button">Done</button>
          </div>
        </div>
      </div>

      <!-- Main Page: Active Rooms & Game Hub -->
      <div class="modal-backdrop main-hub-backdrop" id="room-modal">
        <div class="m3-sheet main-hub-sheet" role="dialog" aria-label="Main Page & Active Rooms">
          <div class="hub-header">
            <div class="hub-title-group">
              <span class="hub-title">8-Ball Pool</span>
              <span class="hub-subtitle" id="modal-room-status">Select or create a game</span>
            </div>
            <button class="m3-btn m3-btn-tonal hub-resume-btn" id="close-modal-btn" type="button">
              Table
            </button>
          </div>

          <div class="sheet-section">
            <input
              type="text"
              id="player-name-input"
              class="m3-input m3-input-name"
              placeholder="Your name (required for multiplayer)"
              maxlength="16"
              autocomplete="nickname"
            />

            <label class="m3-select-row" for="game-mode-select">
              <div class="m3-switch-text">
                <span class="m3-switch-title">Mode</span>
                <span class="m3-switch-sub">Applies to new rooms &amp; racks</span>
              </div>
              <select id="game-mode-select" class="m3-select">
                <option value="normal">Normal</option>
                <option value="cheat">Cheat</option>
                <option value="frictionless">Frictionless</option>
              </select>
            </label>

            <div class="sheet-row">
              <button class="m3-btn m3-btn-primary" id="new-room-btn" type="button">
                + New Room
              </button>
              <button class="m3-btn m3-btn-tonal" id="copy-link-btn" type="button">
                Copy Invite Link
              </button>
            </div>

            <div class="sheet-row">
              <button class="m3-btn m3-btn-tonal" id="new-rack-btn" type="button">
                New Rack
              </button>
              <button class="m3-btn m3-btn-tonal" id="leave-room-btn" type="button">
                Local Pass &amp; Play
              </button>
            </div>
          </div>

          <form class="sheet-row" id="join-room-form">
            <input
              type="text"
              id="join-code-input"
              class="m3-input"
              placeholder="Enter room code"
              maxlength="8"
              autocomplete="off"
              autocapitalize="characters"
            />
            <button class="m3-btn m3-btn-tonal" style="flex: 0 0 auto" type="submit">Join</button>
          </form>

          <div class="sheet-divider"></div>

          <div class="rooms-section">
            <div class="rooms-section-header">
              <span class="rooms-section-title">Active Rooms</span>
              <span class="rooms-count-badge" id="rooms-count-badge">0</span>
            </div>
            <div class="active-rooms-list" id="active-rooms-list"></div>
          </div>
        </div>
      </div>

      <!-- Mandatory Multiplayer Name Prompt Modal -->
      <div class="modal-backdrop hidden" id="name-modal">
        <form class="m3-sheet" id="name-modal-form" role="dialog" aria-label="Enter Your Name">
          <div class="room-code-display">Enter Your Name to Play</div>
          <input
            type="text"
            id="name-modal-input"
            class="m3-input m3-input-name"
            placeholder="Your name"
            maxlength="16"
            required
            autocomplete="nickname"
          />
          <button class="m3-btn m3-btn-primary" type="submit">Play</button>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
